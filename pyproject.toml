[project]
name = "wehave-zwift-at-home"
version = "0.1.0"
description = "Real-time rendering of cycling climbs via 3D Gaussian Splatting, driven by smart trainer output."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gsplat",
    "torch",
    "numpy",
    "viser",
    "Pillow",
    "pycolmap",
    "pytorch-msssim",
    "tqdm",
    "tensorboard",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "ruff",
]
