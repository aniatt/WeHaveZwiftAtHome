<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeHaveZwiftAtHome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    canvas { display: block; }

    /* Crosshair */
    #crosshair {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #crosshair.visible { opacity: 0.6; }
    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 1px;
    }
    #crosshair::before {
      width: 16px; height: 2px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #crosshair::after {
      width: 2px; height: 16px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Instructions overlay */
    #instructions {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(0, 0, 0, 0.7);
      transition: opacity 0.4s;
      cursor: pointer;
    }
    #instructions.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #instructions h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }
    #instructions .keys {
      display: grid;
      grid-template-columns: auto auto;
      gap: 0.4rem 1.5rem;
      font-size: 0.95rem;
      opacity: 0.85;
    }
    .keys kbd {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      padding: 2px 8px;
      font-family: inherit;
      font-size: 0.85rem;
      text-align: center;
      min-width: 2rem;
    }
    #instructions .hint {
      margin-top: 2rem;
      opacity: 0.5;
      font-size: 0.85rem;
    }

    /* Load button */
    #load-btn {
      position: fixed;
      top: 1rem; right: 1rem;
      z-index: 30;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s;
    }
    #load-btn:hover { background: rgba(255,255,255,0.22); }

    /* Drag-and-drop overlay */
    #drop-zone {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #drop-zone.active {
      opacity: 1;
      pointer-events: auto;
    }

    #file-input { display: none; }

    /* Speed indicator */
    #hud {
      position: fixed;
      bottom: 1.5rem; left: 1.5rem;
      z-index: 15;
      font-size: 0.85rem;
      opacity: 0.6;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <div id="instructions">
    <h1>WeHaveZwiftAtHome</h1>
    <div class="keys">
      <kbd>W</kbd><span>Forward</span>
      <kbd>S</kbd><span>Backward</span>
      <kbd>A</kbd><span>Strafe left</span>
      <kbd>D</kbd><span>Strafe right</span>
      <kbd>Shift</kbd><span>Sprint</span>
      <kbd>Mouse</kbd><span>Look around</span>
    </div>
    <p class="hint">Load a .ply file to begin &middot; drag-and-drop or use the button above</p>
    <p class="hint">Then click anywhere to start &middot; ESC to release</p>
  </div>

  <button id="load-btn">Load .ply</button>
  <input type="file" id="file-input" accept=".ply,.splat,.ksplat" />

  <div id="drop-zone">Drop .ply file here</div>

  <div id="hud"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
